<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NodeNanny · 在线终端</title>
<link rel="icon" type="image/png" href="/assets/favicon.png?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css" />
<style>
  /* ---------- 终端 UI v3（UI改版·终端，第二批修正）----------
     创始人反馈v2版本：①用了一套跟主面板完全不同的灰色系配色，看起来像另一个
     应用；②新发明的"紫罗兰卷草花纹"跟产品里其它任何地方都不一样，肉眼看下来
     只是一条不起眼的直线；③速查表按钮里的svg图标没写尺寸，撑爆了按钮导致
     文字被挤到卡片外面；④终端连接前有个来源不明的白色竖条。
     这一版改正：直接复用 public/index.html 的真实变量取值（bg-a/bg-b/surface/
     hairline/text/brass 等），字体也换成主面板同款的 IBM Plex Sans（正文）+
     Fraunces（标题），四角装饰改用主面板本来就在用的 .rivet 铜制包边手法
     （小写的L形黄铜边框+一个小圆点），不再发明新的花纹语言。 */
  :root {
    --bg-a: #121a1c;
    --bg-b: #0c1214;
    --surface: #161e21;
    --surface-2: #1a2124;
    --hairline: #2b3538;
    --text: #e4dcc8;
    --text-muted: #8a8f8a;
    --brass: #c8963e;
    --brass-soft: #e0b667;
    --brass-dim: #7d6534;
    --teal: #4d8478;
    --teal-soft: #7fada4;
    --rust: #c05a44;
    --rust-soft: #dd8468;
    --relic-glow: rgba(200, 150, 62, 0.18);
  }
  .xterm-viewport::-webkit-scrollbar { width: 8px; }
  .xterm-viewport::-webkit-scrollbar-track { background: var(--bg-b); }
  .xterm-viewport::-webkit-scrollbar-thumb { background: var(--brass-dim); border-radius: 4px; }
  .xterm-viewport::-webkit-scrollbar-thumb:hover { background: var(--brass); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: linear-gradient(180deg, var(--bg-a) 0%, var(--bg-b) 100%);
    color: var(--text);
    font-family: 'IBM Plex Sans', -apple-system, 'PingFang SC', 'Hiragino Sans', 'Yu Gothic', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .term-page {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 18px;
    gap: 10px;
    min-height: 0;
  }

  .term-breadcrumb {
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .term-breadcrumb a { color: var(--brass-soft); text-decoration: none; cursor: pointer; }
  .term-breadcrumb a:hover { text-decoration: underline; }
  /* 被嵌入终端悬浮层时(index.html里的iframe)，外层悬浮层壳自己已经有一个
     圆形关闭按钮，这里的面包屑就不需要再占一行地方，直接隐藏。判断逻辑
     见下面的内嵌脚本：window.self !== window.top。 */
  body.embedded .term-breadcrumb { display: none; }
  body.embedded .term-page { padding-top: 10px; }

  /* ---------- 卡片本体：跟主面板 .log 卡片同一套视觉语言（surface底+hairline边框+
     brass顶边强调），不再自己发明一套灰色系 ---------- */
  .term-card {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 3px solid var(--brass);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.35), inset 0 0 0 1px rgba(232,196,119,0.08), 0 8px 24px rgba(0,0,0,0.28);
  }

  /* ---------- 四角铜制包边：跟主面板卡片完全同款的 .rivet 手法（L形黄铜边框+
     一个小圆点），不是另起一套花纹语言。四角都套用，视觉上跟主面板一眼能认出
     是同一个产品。 ---------- */
  .rivet { position: absolute; z-index: 2; width: 14px; height: 14px; pointer-events: none; }
  .rivet::before {
    content: '';
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--brass);
    box-shadow: 0 0 4px var(--relic-glow);
  }
  .rivet.tl { top: 10px; left: 10px; border-top: 1.4px solid var(--brass); border-left: 1.4px solid var(--brass); }
  .rivet.tl::before { top: -2.5px; left: -2.5px; }
  .rivet.tr { top: 10px; right: 10px; border-top: 1.4px solid var(--brass); border-right: 1.4px solid var(--brass); }
  .rivet.tr::before { top: -2.5px; right: -2.5px; }
  .rivet.bl { bottom: 10px; left: 10px; border-bottom: 1.4px solid var(--brass); border-left: 1.4px solid var(--brass); }
  .rivet.bl::before { bottom: -2.5px; left: -2.5px; }
  .rivet.br { bottom: 10px; right: 10px; border-bottom: 1.4px solid var(--brass); border-right: 1.4px solid var(--brass); }
  .rivet.br::before { bottom: -2.5px; right: -2.5px; }

  /* ---------- 顶部状态栏：进程标识 + 运行状态徽章 + 操作按钮 ---------- */
  .term-header {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 22px;
    background: var(--surface-2);
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .term-header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .term-header-left > svg { width: 18px; height: 18px; flex-shrink: 0; }
  .term-title { font-family: 'Fraunces', serif; font-size: 15px; font-weight: 500; color: var(--text); white-space: nowrap; letter-spacing: 0.01em; }

  .term-status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 3px 9px 3px 7px;
    border-radius: 999px;
    background: rgba(138,143,138,0.14);
    color: var(--text-muted);
    white-space: nowrap;
  }
  .term-status-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .term-status-badge.state-connecting { background: rgba(200,150,62,0.16); color: var(--brass-soft); }
  .term-status-badge.state-connecting .term-status-dot { background: var(--brass); animation: term-pulse 1s ease-in-out infinite; }
  .term-status-badge.state-connected { background: rgba(77,132,120,0.2); color: var(--teal-soft); }
  .term-status-badge.state-connected .term-status-dot { background: var(--teal); animation: term-pulse 2.2s ease-in-out infinite; }
  .term-status-badge.state-error { background: rgba(192,90,68,0.18); color: var(--rust-soft); }
  .term-status-badge.state-error .term-status-dot { background: var(--rust); }
  @keyframes term-pulse { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }

  .term-header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .term-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    color: var(--text);
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12.5px;
    font-family: inherit;
    white-space: nowrap;
  }
  /* 按钮内图标统一约束尺寸——上一版没写这条规则，图标撑到浏览器默认大小，
     把"速查表"三个字挤出了卡片边界，这是这次修的一个真实bug。 */
  .term-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .term-btn:hover:not(:disabled) { border-color: var(--brass); }
  .term-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .term-btn.primary { background: var(--teal); border-color: var(--teal); color: #f1faf7; }
  .term-btn.primary:hover:not(:disabled) { border-color: var(--teal-soft); }
  .term-btn.ghost { background: transparent; border-color: var(--hairline); }
  /* 速查表按钮：知识库修复命令的入口，是终端里唯一的"安全网"功能，
     不能跟普通操作按钮一样容易被忽略，用黄铜色边框+浅色文字强调一下。 */
  .term-btn.kb {
    background: rgba(200,150,62,0.1);
    border-color: var(--brass-dim);
    color: var(--brass-soft);
  }
  .term-btn.kb:hover:not(:disabled) { background: rgba(200,150,62,0.18); border-color: var(--brass-soft); }
  .term-btn.kb:disabled { background: transparent; color: var(--text-muted); border-color: var(--hairline); }

  /* ---------- 解锁行：连接前展示，连接成功后收起，避免连上之后界面还挂着一行密码框 ---------- */
  .term-unlock-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 22px;
    background: var(--surface);
    border-bottom: 1px solid var(--hairline);
    flex-wrap: wrap;
  }
  .term-unlock-row.hidden { display: none; }
  .term-unlock-row label { font-size: 12.5px; color: var(--text-muted); }
  .term-unlock-row input {
    background: var(--bg-b);
    border: 1px solid var(--hairline);
    color: var(--text);
    padding: 6px 9px;
    border-radius: 5px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12.5px;
    min-width: 160px;
  }
  .term-unlock-row input:focus { outline: none; border-color: var(--brass); }

  /* ---------- 输出区：彩色分级由 xterm 自身的 ANSI 颜色 + 我们写入的提示行颜色承担 ---------- */
  .term-body {
    position: relative;
    flex: 1;
    min-height: 0;
    padding: 10px;
    background: var(--bg-b);
  }
  #terminal-container { height: 100%; }

  /* ---------- 连接前的引导占位：解锁前终端主体完全空白容易让人以为卡住了，
     这里叠一层居中提示，连接成功（收到ready消息）后由JS加.hidden隐藏，
     断开重连时会重新显示。 ---------- */
  .term-placeholder {
    position: absolute;
    inset: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    text-align: center;
    padding: 24px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .term-placeholder.hidden { display: none; }
  .term-placeholder svg { width: 34px; height: 34px; color: var(--brass-dim); }
  .term-placeholder-title { font-family: 'Fraunces', serif; font-size: 14px; font-weight: 500; color: var(--text); }
  .term-placeholder-sub { font-size: 12px; line-height: 1.6; max-width: 320px; }

  /* ---------- 底部提示区：跟输出区在同一张卡片内，不是浮在页面外的说明文字 ---------- */
  .term-footer {
    padding: 9px 22px;
    font-size: 11.5px;
    color: var(--text-muted);
    background: var(--surface-2);
    border-top: 1px solid var(--hairline);
    line-height: 1.6;
  }

  /* ---------- 知识库速查表弹窗：终端模块内直接查看修复命令，不需要跳转到wiki页面。
       verified:true的条目才显示"填入终端"按钮，否则只显示"复制"——这是
       v4文档要求的"AI/远程生成的建议默认仅可复制手动执行"在前端的体现，
       真正的强制在core/terminal.js的写入接口那一层，这里的限制是双保险。 ---------- */
  .memo-overlay { display: none; position: fixed; inset: 0; background: rgba(8,10,13,0.72); z-index: 200; align-items: flex-start; justify-content: center; }
  .memo-overlay.open { display: flex; }
  .memo-box {
    position: relative;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-top: 3px solid var(--brass);
    border-radius: 8px;
    width: 640px;
    max-width: 92vw;
    margin-top: 6vh;
    max-height: 84vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(0,0,0,0.35), inset 0 0 0 1px rgba(232,196,119,0.08), 0 10px 30px rgba(0,0,0,0.4);
  }
  .memo-head { padding: 14px 18px; border-bottom: 1px solid var(--hairline); display: flex; align-items: center; gap: 10px; }
  .memo-head input { flex: 1; background: var(--bg-b); border: 1px solid var(--hairline); color: var(--text); padding: 6px 10px; border-radius: 4px; font-family: inherit; }
  .memo-close { background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer; }
  .memo-list { overflow-y: auto; padding: 10px 18px; }
  .memo-entry { border-bottom: 1px solid var(--hairline); padding: 12px 0; }
  .memo-entry:last-child { border-bottom: none; }
  .memo-title { font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; color: var(--text); }
  .risk-badge { font-size: 11px; padding: 1px 7px; border-radius: 10px; font-weight: 500; }
  .risk-low { background: rgba(77,132,120,0.22); color: var(--teal-soft); }
  .risk-medium { background: rgba(200,150,62,0.2); color: var(--brass-soft); }
  .risk-high { background: rgba(192,90,68,0.22); color: var(--rust-soft); }
  .risk-copy { background: var(--surface-2); color: var(--text-muted); }
  .memo-explain { font-size: 12.5px; color: var(--text-muted); margin: 6px 0 8px; line-height: 1.6; }
  .memo-cmd-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .memo-cmd-row code { flex: 1; background: var(--bg-b); padding: 4px 8px; border-radius: 4px; font-size: 12.5px; overflow-x: auto; white-space: nowrap; font-family: 'IBM Plex Mono', monospace; }
  .memo-cmd-row button { background: var(--teal); border: none; color: #f1faf7; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; font-family: inherit; }
  .memo-cmd-row button.secondary { background: var(--surface-2); color: var(--text); }
  .memo-cmd-status { font-size: 11.5px; color: var(--brass-soft); margin-left: 4px; }

  @media (max-width: 640px) {
    .term-page { padding: 10px; }
    .term-header { flex-direction: column; align-items: flex-start; }
    .term-header-right { width: 100%; justify-content: space-between; }
  }
</style>
</head>
<body>
  <div class="term-page">
    <div class="term-breadcrumb"><a href="/" id="term-back-link">← 返回主面板</a></div>

    <div class="term-card">
      <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>

      <div class="term-header">
        <div class="term-header-left">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M14.5 3 L17.5 3 L19 10 L13 10 Z" fill="#c8963e"/>
            <path d="M13.3 10.5 H18.7 L20.5 24 H11.5 Z" fill="none" stroke="#8a8f8a" stroke-width="1.1"/>
            <line x1="12.2" y1="15" x2="19.8" y2="15" stroke="#8a8f8a" stroke-width="1"/>
            <line x1="11.8" y1="19.5" x2="20.2" y2="19.5" stroke="#8a8f8a" stroke-width="1"/>
            <line x1="6" y1="24" x2="26" y2="24" stroke="#8a8f8a" stroke-width="1.2"/>
          </svg>
          <span class="term-title">远程 Shell</span>
          <span class="term-status-badge state-idle" id="status-badge">
            <span class="term-status-dot"></span>
            <span id="status-msg">未解锁</span>
          </span>
        </div>
        <div class="term-header-right">
          <button id="memo-btn" class="term-btn kb" disabled title="连接终端后可用：查看知识库修复命令速查表">
            <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M3 4c2-1 5-1 7 0v12c-2-1-5-1-7 0V4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
              <path d="M17 4c-2-1-5-1-7 0v12c2-1 5-1 7 0V4Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
            </svg>
            速查表
          </button>
        </div>
      </div>

      <div class="term-unlock-row" id="unlock-row">
        <label for="terminal-password">终端密码</label>
        <input id="terminal-password" type="password" autocomplete="off" />
        <button id="unlock-btn" class="term-btn primary">解锁并连接</button>
      </div>

      <div class="term-body">
        <div id="terminal-container"></div>
        <div class="term-placeholder" id="term-placeholder">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <rect x="3" y="6" width="26" height="20" rx="2" stroke="currentColor" stroke-width="1.3"/>
            <path d="M8 13l4 3-4 3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
            <line x1="15" y1="19" x2="21" y2="19" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          <div class="term-placeholder-title">终端尚未连接</div>
          <div class="term-placeholder-sub">在上方输入终端密码并点击"解锁并连接"，即可在这里打开一个远程shell会话。</div>
        </div>
      </div>

      <div class="term-footer">
        这是一台正在被 NodeNanny 看护的服务器的远程shell，操作等同于直接登录服务器终端，请谨慎执行命令。
        遇到问题时，优先点击右上角"速查表"查看知识库里已核对过的修复命令，而不是凭记忆直接敲；标记为
        "未经人工确认"的命令仅支持复制、需要你手动粘贴执行后再确认。会话空闲一段时间后会自动断开，重新
        解锁即可继续。
      </div>
    </div>
  </div>

  <!-- 知识库速查表弹窗，逻辑不变，只是外壳挪到了终端卡片体系之外（覆盖整个页面） -->
  <div class="memo-overlay" id="memoOverlay">
    <div class="memo-box">
      <div class="rivet tl"></div><div class="rivet tr"></div><div class="rivet bl"></div><div class="rivet br"></div>
      <div class="memo-head">
        <input type="text" id="memoSearch" placeholder="搜索知识库条目（标题/关键词）..." autocomplete="off">
        <button class="memo-close" id="memoCloseBtn">&times;</button>
      </div>
      <div class="memo-list" id="memoList">加载中…</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
  <script>
    // ---------- 嵌入检测（UI改版·容器方式）----------
    // 判断当前是不是被index.html的悬浮层用iframe嵌入。是的话：
    // 1) 给body加embedded类，隐藏面包屑(悬浮层壳自己已经有关闭按钮)；
    // 2) 面包屑链接本身改成postMessage通知外层关闭悬浮层，而不是在iframe
    //    内部导航到"/"（那样会在悬浮层这个小窗口里显示整个主面板，很怪）。
    // 直接从URL访问/terminal.html(不经过悬浮层)时，window.self === window.top，
    // 走原来的行为：正常跳转回主面板。
    const embeddedInOverlay = (window.self !== window.top);
    if (embeddedInOverlay) {
      document.body.classList.add('embedded');
    }
    document.getElementById('term-back-link').addEventListener('click', (e) => {
      if (embeddedInOverlay) {
        e.preventDefault();
        window.parent.postMessage('nodenanny:terminal:close', window.location.origin);
      }
      // 非嵌入模式：不preventDefault，走href="/"的原生跳转
    });

    const term = new Terminal({
      convertEol: true,
      fontFamily: "'IBM Plex Mono', monospace",
      fontSize: 13,
      theme: { background: '#0c1214', foreground: '#e4dcc8', cursor: '#c8963e' }
    });
    const fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(document.getElementById('terminal-container'));
    // 之前这里是 term.open() 之后立刻同步调用 fitAddon.fit()——这个bug会导致
    // xterm 在容器还没有完成真正的flex布局分配（此时读到的宽度可能是0或者
    // 不准确的初始值）时就去计算列数，算出"1列、高度撑满"这种畸形尺寸，
    // 视觉上就是一条铺满高度的白色竖条（那其实是被拉伸变形的光标块）。
    // 改成等两帧动画帧之后（确保浏览器已经完成一次真正的布局/绘制）再fit，
    // 保险起见resize时也一样处理。
    requestAnimationFrame(() => {
      requestAnimationFrame(() => fitAddon.fit());
    });

    let ws = null;
    let currentSessionId = null;

    // 状态徽章：state-idle（灰，未解锁）/ state-connecting（琥珀，脉动）/
    // state-connected（青绿，脉动更慢）/ state-error（锈红，静止），
    // 只是纯视觉层的状态展示，不影响下面任何一条已有的解锁/连接逻辑。
    function setStatusBadge(state, text) {
      const badge = document.getElementById('status-badge');
      badge.className = `term-status-badge state-${state}`;
      document.getElementById('status-msg').textContent = text;
    }

    async function unlockAndConnect() {
      const password = document.getElementById('terminal-password').value;
      const btn = document.getElementById('unlock-btn');
      btn.disabled = true;
      setStatusBadge('connecting', '验证中…');
      try {
        const resp = await fetch('/api/terminal/unlock', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        const data = await resp.json();
        if (!data.ok) {
          setStatusBadge('error', '密码错误或终端未启用：' + (data.error || ''));
          btn.disabled = false;
          return;
        }
        setStatusBadge('connecting', `已解锁（${data.expiresInMinutes}分钟内有效），正在连接…`);
        connectWebSocket();
      } catch (err) {
        setStatusBadge('error', '请求失败：' + err.message);
        btn.disabled = false;
      }
    }

    function connectWebSocket() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws/terminal`);

      ws.onopen = () => {
        setStatusBadge('connecting', '已连接，等待会话就绪…');
        // 首次连接后立刻同步一次终端尺寸
        sendResize();
      };
      ws.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'ready') {
          currentSessionId = msg.sessionId;
          document.getElementById('memo-btn').disabled = false;
          document.getElementById('unlock-row').classList.add('hidden');
          document.getElementById('term-placeholder').classList.add('hidden');
          setStatusBadge('connected', '已连接');
          console.log('终端会话ID（知识库写入命令时需要用到）：', currentSessionId);
        } else if (msg.type === 'output') {
          term.write(msg.data);
        } else if (msg.type === 'idle_timeout') {
          term.write('\r\n[会话因空闲超时已关闭，请重新解锁]\r\n');
        }
      };
      ws.onclose = () => {
        setStatusBadge('error', '连接已关闭');
        document.getElementById('unlock-btn').disabled = false;
        document.getElementById('unlock-row').classList.remove('hidden');
        document.getElementById('term-placeholder').classList.remove('hidden');
        document.getElementById('memo-btn').disabled = true;
        currentSessionId = null;
      };
      ws.onerror = () => {
        setStatusBadge('error', '连接出错');
      };

      term.onData((data) => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'input', data }));
        }
      });
    }

    function sendResize() {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      fitAddon.fit();
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }

    window.addEventListener('resize', sendResize);
    document.getElementById('unlock-btn').addEventListener('click', unlockAndConnect);

    // ---------- 知识库速查表：终端内直接查看修复命令，不用跳转到wiki页面 ----------
    const memoBtn = document.getElementById('memo-btn');
    const memoOverlay = document.getElementById('memoOverlay');
    const memoCloseBtn = document.getElementById('memoCloseBtn');
    const memoSearch = document.getElementById('memoSearch');
    const memoList = document.getElementById('memoList');
    let kbEntries = [];
    const LANG = 'zh'; // 面板当前语言配置走后端config.language，这里先固定zh，后续可以从/api/status带出来跟随面板语言

    function escapeHtml(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    function riskBadge(risk) {
      const map = { low: ['risk-low', 'low'], medium: ['risk-medium', 'medium'], high: ['risk-high', 'high'] };
      const [cls, label] = map[risk] || ['risk-copy', risk];
      return `<span class="risk-badge ${cls}">${label}</span>`;
    }

    function renderMemoList(filterText) {
      const q = (filterText || '').trim().toLowerCase();
      const filtered = !q ? kbEntries : kbEntries.filter((e) => {
        const hay = `${e.title} ${(e.explanation && e.explanation[LANG]) || ''} ${(e.matchPatterns || []).join(' ')}`.toLowerCase();
        return hay.includes(q);
      });
      if (!filtered.length) {
        memoList.innerHTML = '<div style="color:#8a8f8a;padding:12px 0;">没有匹配的知识库条目</div>';
        return;
      }
      memoList.innerHTML = filtered.map((entry) => {
        const verified = entry.verified === true;
        const explain = (entry.explanation && entry.explanation[LANG]) || '';
        const cmdRows = (entry.fixCommands || []).map((cmd, idx) => {
          const cmdId = `${entry.id}__${idx}`;
          const actionBtn = verified
            ? `<button data-cmd-id="${cmdId}" class="memo-run-btn">填入终端</button>`
            : `<button data-cmd-id="${cmdId}" class="memo-copy-btn secondary">复制（未经人工确认，不能一键执行）</button>`;
          return `<div class="memo-cmd-row">
            <code id="code-${cmdId}">${escapeHtml(cmd)}</code>
            ${actionBtn}
            <span class="memo-cmd-status" id="status-${cmdId}"></span>
          </div>`;
        }).join('');
        return `<div class="memo-entry">
          <div class="memo-title">${escapeHtml(entry.title)} ${riskBadge(entry.riskLevel)} ${verified ? '' : riskBadge('copy-only')}</div>
          <div class="memo-explain">${escapeHtml(explain)}</div>
          ${cmdRows}
        </div>`;
      }).join('');

      // 事件委托：一次性绑定，避免每次搜索重新渲染都重复addEventListener
    }

    memoList.addEventListener('click', async (e) => {
      const runBtn = e.target.closest('.memo-run-btn');
      const copyBtn = e.target.closest('.memo-copy-btn');
      if (!runBtn && !copyBtn) return;
      const btn = runBtn || copyBtn;
      const cmdId = btn.getAttribute('data-cmd-id');
      const [entryId, idxStr] = cmdId.split('__');
      const entry = kbEntries.find((e2) => e2.id === entryId);
      const command = entry && entry.fixCommands[Number(idxStr)];
      const statusEl = document.getElementById(`status-${cmdId}`);
      if (!command) return;

      if (copyBtn) {
        try {
          await navigator.clipboard.writeText(command);
          statusEl.textContent = '已复制，请手动粘贴到终端确认后执行';
        } catch (err) {
          statusEl.textContent = '复制失败，请手动选中命令文本';
        }
        return;
      }

      if (!currentSessionId) {
        statusEl.textContent = '请先解锁并连接终端';
        return;
      }
      statusEl.textContent = '写入中…';
      try {
        const resp = await fetch('/api/terminal/write-command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: currentSessionId, command, riskLevel: entry.riskLevel, verified: entry.verified === true })
        });
        const data = await resp.json();
        if (!data.ok) {
          const msgs = { terminal_busy_user_typing: '终端正忙（你正在手动输入），请手动粘贴命令', session_not_found: '终端会话已失效，请重新连接' };
          statusEl.textContent = msgs[data.error] || `失败：${data.error}`;
          return;
        }
        if (data.risk === 'low' && data.executed) {
          statusEl.textContent = '已自动执行（低风险命令）';
        } else if (data.risk === 'medium') {
          statusEl.textContent = '已填入终端输入框，请手动按回车确认';
        } else if (data.confirmToken) {
          statusEl.innerHTML = `高危命令，需二次确认（60秒内有效） <button class="memo-confirm-btn" data-session-token="${currentSessionId}::${data.confirmToken}">确认执行</button>`;
        } else if (data.note === 'unverified_entry_copy_only') {
          statusEl.textContent = '该条目未经人工确认，仅支持复制手动执行';
        }
      } catch (err) {
        statusEl.textContent = `请求失败：${err.message}`;
      }
    });

    // 高危命令的"确认执行"按钮是动态插入的innerHTML，同样走事件委托处理点击
    memoList.addEventListener('click', async (e) => {
      const confirmBtn = e.target.closest('.memo-confirm-btn');
      if (!confirmBtn) return;
      const [sessionId, confirmToken] = confirmBtn.getAttribute('data-session-token').split('::');
      confirmBtn.disabled = true;
      confirmBtn.textContent = '确认中…';
      try {
        const resp = await fetch('/api/terminal/confirm-command', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, confirmToken })
        });
        const data = await resp.json();
        confirmBtn.parentElement.textContent = data.ok
          ? '已填入终端，请手动按回车确认（高危命令始终需要人工按下Enter）'
          : `确认失败：${data.error}`;
      } catch (err) {
        confirmBtn.parentElement.textContent = `请求失败：${err.message}`;
      }
    });

    async function openMemo() {
      memoOverlay.classList.add('open');
      if (kbEntries.length === 0) {
        memoList.textContent = '加载中…';
        try {
          const resp = await fetch('/api/kb/list');
          const data = await resp.json();
          kbEntries = data.entries || [];
        } catch (err) {
          memoList.textContent = `加载知识库失败：${err.message}`;
          return;
        }
      }
      renderMemoList(memoSearch.value);
    }

    memoBtn.addEventListener('click', openMemo);
    memoCloseBtn.addEventListener('click', () => memoOverlay.classList.remove('open'));
    memoOverlay.addEventListener('click', (e) => { if (e.target === memoOverlay) memoOverlay.classList.remove('open'); });
    memoSearch.addEventListener('input', () => renderMemoList(memoSearch.value));
  </script>
</body>
</html>
